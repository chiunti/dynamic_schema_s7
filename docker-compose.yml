# Development Docker Compose configuration
# For production, use docker-compose.prod.yml

services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dynamic_schema}
      POSTGRES_USER: ${POSTGRES_USER:-dynamic_schema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dynamic_schema_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dynamic_schema}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # s7-author MCP server over streamable-http — remote agents connect with
  # per-request credentials (Authorization + X-S7-Project-Id headers), so no
  # S7_TOKEN/S7_PROJECT_ID is configured here. Localhost-only binding: in dev
  # the endpoint must never leave the loopback interface.
  mcp:
    build: .
    command: python -m s7_mcp --transport streamable-http --host 0.0.0.0 --port 8000
    environment:
      S7_BASE_URL: http://web:8000
    ports:
      - "127.0.0.1:${S7_MCP_PORT:-8010}:8000"
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  postgres_data:

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dynamic_schema}
      POSTGRES_USER: ${POSTGRES_USER:-dynamic_schema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dynamic_schema}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: ${DB_CPU_LIMIT:-2.0}
          memory: ${DB_MEMORY_LIMIT:-1G}
        reservations:
          cpus: ${DB_CPU_RESERVATION:-0.5}
          memory: ${DB_MEMORY_RESERVATION:-256M}

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             exec gunicorn --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-4} --threads ${GUNICORN_THREADS:-2} --timeout ${GUNICORN_TIMEOUT:-120} config.wsgi:application"
    expose:
      - "8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dynamic_schema}
      POSTGRES_USER: ${POSTGRES_USER:-dynamic_schema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA:-s7,public}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS is required}
      DJANGO_SETTINGS_MODULE: config.settings.production
      # 0005_example_seed is demo data; skip it in production by default
      S7_SKIP_EXAMPLE_SEED: ${S7_SKIP_EXAMPLE_SEED:-1}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: ${WEB_CPU_LIMIT:-2.0}
          memory: ${WEB_MEMORY_LIMIT:-1G}
        reservations:
          cpus: ${WEB_CPU_RESERVATION:-0.5}
          memory: ${WEB_MEMORY_RESERVATION:-256M}

volumes:
  postgres_data:
